name: Deploy project homepage

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-project-site.mjs"
      - "docs/assets/desktop-preview.webp"
      - "docs/assets/mobile-preview.webp"
      - ".github/workflows/project-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Build the project homepage
        run: node scripts/build-project-site.mjs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .project-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

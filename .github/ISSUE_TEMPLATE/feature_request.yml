name: 改进建议
description: 提议改进叙事、设计、交互、性能或工程体验
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述用户或维护者现在遇到的具体问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期行为、可能的界面变化或实现方向。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与取舍
      description: 哪些内容应该包含，哪些内容应保持不变？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 建议不依赖虚构的个人经历、项目指标或产品证据。
          required: true
        - label: 建议不要求公开私人信息或未授权素材。
          required: true
